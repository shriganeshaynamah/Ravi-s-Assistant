    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ravi’s Assistant" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:title" content="Dr. Ravi Shankar - LifeOS & Medical HQ" />
    <meta property="og:description" content="All-in-one personal Life OS for Dr. Ravi Shankar (BAMS Doctor): Google Calendar sync, clinical roadmap, clinical & personal notes, expense manager, habits, life journey corners, and Google Cloud sync." />

  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new Event('pwa-prompt-ready'));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .catch(function () {
              return navigator.serviceWorker.register('/sw-push.js', { scope: '/' });
            })
            .catch(function () {});
        });
      }
    </script>
  </body>
</html>
